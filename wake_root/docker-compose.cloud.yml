version: '3.8'
services:
  frontend:
    build: ./frontend
    ports:
      - "80:3000"
    restart: always
  synergy-ui:
    image: ghcr.io/crisptech-ai/synergy-ui:latest
    volumes:
      - synergy_ui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: always
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: always
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup
    restart: always
volumes:
  synergy_ui_data:
  ollama_data: